name: test
on:
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.x

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Running go tests
        env:
          GO111MODULE: on
        run: make test